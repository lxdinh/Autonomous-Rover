; ESP32-S3 vision rover — PlatformIO build configuration.
;
; Camera: ArduCAM OV2640 Mini 2MP. The model is selected with -DOV2640_MINI_2MP
; below. Defining it as a global build flag (rather than only via the library's
; memorysaver.h) reliably satisfies the ArduCAM header guard regardless of which
; memorysaver.h ends up on the include path. include/memorysaver.h mirrors it.
;
; Serial: the ESP32-S3 is routed to the native USB-CDC port so that UART0
; (GPIO43/44) is free to be used as the L298N IN1/IN2 motor lines. Open the
; Serial Monitor on the board's "USB" port, not the "UART" port.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem_size = 0m
lib_deps =
    arducam/ArduCAM@^1.0.0
build_flags =
    -DOV2640_MINI_2MP
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/include
